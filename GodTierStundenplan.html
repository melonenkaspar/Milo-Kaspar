<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stundenplan 2026/27 — Inda-Gymnasium</title>
<style>
/* Farben, Masse, Theme -------------------------------------------------- */
:root{
  color-scheme:light;
  --ink:#15181d; --ink-2:#4a525e; --ink-3:#7b8593;
  --bg:#fbfbf9; --surface:#fff; --rule:#dfe2e6; --rule-soft:#eceef0;
  --link:#0b4f6c; --sel:#e8f0f4; --mark:#c9dae4;
  --gutter:20px; --tap:44px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e9ecef; --ink-2:#aab3bd; --ink-3:#7e8894;
  --bg:#14171a; --surface:#1b1f23; --rule:#2c3238; --rule-soft:#23282d;
  --link:#7fc4e8; --sel:#1d2c36; --mark:#2f4756;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    color-scheme:dark;
    --ink:#e9ecef; --ink-2:#aab3bd; --ink-3:#7e8894;
    --bg:#14171a; --surface:#1b1f23; --rule:#2c3238; --rule-soft:#23282d;
    --link:#7fc4e8; --sel:#1d2c36; --mark:#2f4756;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* Kopf ------------------------------------------------------------------ */
header{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--rule)}
.bar{max-width:1200px;margin:0 auto;padding:10px var(--gutter);
  display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.school{color:var(--ink-3);font-size:13px}
nav{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:1px solid transparent;border-radius:6px;
  padding:7px 12px;min-height:36px;cursor:pointer;color:var(--ink-2)}
nav button:hover{background:var(--rule-soft)}
nav button[aria-current="true"]{background:var(--sel);color:var(--link);font-weight:600}
#theme{border-color:var(--rule);font-size:13px;min-width:74px}

/* Grundgeruest ---------------------------------------------------------- */
main{max-width:1200px;margin:0 auto;padding:var(--gutter);
  display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.browse{position:sticky;top:62px;display:flex;flex-direction:column;gap:8px}
.controls{display:flex;gap:6px}
#search{flex:1;min-width:0;min-height:var(--tap);padding:8px 10px;
  border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
#level{min-height:var(--tap);padding:8px 6px;border:1px solid var(--rule);
  border-radius:6px;background:var(--surface)}
#tally{margin:0 2px;font-size:12px;color:var(--ink-3)}
#results{border:1px solid var(--rule);border-radius:8px;background:var(--surface);
  max-height:calc(100vh - 210px);overflow:auto;-webkit-overflow-scrolling:touch}
#results button{display:block;width:100%;min-height:var(--tap);text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule-soft);
  padding:9px 12px;cursor:pointer}
#results button:last-child{border-bottom:0}
#results button:hover{background:var(--sel)}
#results button[aria-current="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--link)}
#results b{display:block;font-weight:400}
#results small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}

#detail{background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  padding:22px 24px;min-width:0}
h2{margin:0 0 3px;font-size:22px;font-weight:650;letter-spacing:-.02em}
.summary{margin-bottom:20px;color:var(--ink-2);font-size:13.5px}
h3{margin:26px 0 8px;font-size:12px;font-weight:650;color:var(--ink-3)}
h3:first-of-type{margin-top:0}
.note{margin:-4px 0 8px;font-size:12.5px;color:var(--ink-3)}
details{margin:6px 0}
summary{cursor:pointer;min-height:32px;padding:6px 0;font-size:13px;color:var(--link)}
details div{padding:2px 0 6px 2px;font-size:13px;color:var(--ink-2)}

/* Tabellen -------------------------------------------------------------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);white-space:nowrap;
  font-size:12px;font-weight:600;color:var(--ink-3);text-align:left}
th[data-col]{cursor:pointer;user-select:none}
th[data-col]:hover{color:var(--ink)}
th[data-col]::after{content:"";display:inline-block;width:12px;opacity:.55}
th[aria-sort="ascending"]::after{content:"\2191"}
th[aria-sort="descending"]::after{content:"\2193"}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
.right{text-align:right;padding-right:14px;white-space:nowrap}
.plain td:first-child{width:150px;color:var(--ink-2)}

/* Wochenraster ---------------------------------------------------------- */
.daytabs{display:none;gap:4px;margin-bottom:8px}
.daytabs button{flex:1;min-height:var(--tap);border:1px solid var(--rule);
  border-radius:6px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.daytabs button[aria-current="true"]{background:var(--sel);color:var(--link);font-weight:600}
.week{table-layout:fixed;min-width:470px;font-size:12px}
.week th{padding:0 0 6px;border:0;text-align:center;font-size:12px}
.week td{height:34px;padding:0;border:1px solid var(--rule-soft);vertical-align:middle}
.week .hour{width:44px;border:0;padding-right:7px;text-align:right;
  font-size:11px;line-height:1.2;color:var(--ink-3)}
.week .hour small{display:block;font-size:9.5px;opacity:.75}
.week tr.now .hour{color:var(--ink);font-weight:650}
.week td.now{outline:2px solid var(--link);outline-offset:-2px}
.lesson{height:100%;padding:3px 5px;display:flex;flex-direction:column;
  justify-content:center;overflow:hidden;background:var(--sel);
  border-left:2px solid var(--link)}
.lesson.multi{border-left-width:3px}
.lesson a{font-weight:600;font-size:11.5px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson.multi a{white-space:normal}
.lesson span{font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.free{height:100%;display:flex;align-items:center;justify-content:center;
  background:var(--mark);font-size:11px;color:var(--ink)}

/* Terminsuche ----------------------------------------------------------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{min-height:36px;padding:5px 10px;border:1px solid var(--rule);
  border-radius:16px;background:var(--surface);cursor:pointer}
.chips button::after{content:" ×";color:var(--ink-3)}
.chips .clear{border-style:dashed;color:var(--ink-3)}
.chips .clear::after{content:""}

.roster{column-width:185px;column-gap:26px}
.roster div{break-inside:avoid;padding:3px 0;font-size:13.5px}
.roster i{display:inline-block;width:26px;font-style:normal;color:var(--ink-3)}
.blank{padding:40px 0;text-align:center;color:var(--ink-3)}

footer{max-width:1200px;margin:24px auto 0;padding:22px var(--gutter) 40px;
  border-top:1px solid var(--rule);color:var(--ink-3);font-size:12.5px}
footer p{margin:4px 0;max-width:74ch}

/* Schmale Geraete ------------------------------------------------------- */
@media(max-width:860px){
  main{grid-template-columns:1fr;gap:16px;--gutter:14px}
  .browse{position:static}
  #results{max-height:42vh}
  #detail{padding:16px 15px}
  h2{font-size:19px}
  nav{width:100%;margin-left:0}
  nav button{flex:1 1 auto;min-width:86px;min-height:var(--tap);
    padding:8px 6px;text-align:center;font-size:14px}
  .plain td:first-child{width:120px}
}
@media(max-width:600px){
  .daytabs{display:flex}
  .week{min-width:0}
  .week [data-d]{display:none}
  .week[data-only="0"] [data-d="0"],
  .week[data-only="1"] [data-d="1"],
  .week[data-only="2"] [data-d="2"],
  .week[data-only="3"] [data-d="3"],
  .week[data-only="4"] [data-d="4"]{display:table-cell}
  .week td{height:44px}
  .week .hour{width:52px;font-size:12px}
  .lesson a{font-size:13px;white-space:normal}
  .lesson span{font-size:11.5px}
}
@media print{
  header,.browse,footer,.daytabs{display:none}
  main{display:block;max-width:none;padding:0}
  #detail{border:0;padding:0}
  a{color:inherit}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Stundenplan 2026/27</h1>
    <span class="school">Inda-Gymnasium Aachen</span>
    <nav>
      <button data-view="people" aria-current="true">Schüler</button>
      <button data-view="courses">Kurse</button>
      <button data-view="teachers">Lehrkräfte</button>
      <button data-view="rooms">Räume</button>
      <button data-view="finder">Termin</button>
      <button id="theme" title="Darstellung wechseln">Auto</button>
    </nav>
  </div>
</header>

<main>
  <div class="browse">
    <div class="controls">
      <input id="search" type="search" placeholder="Suchen" autocomplete="off">
      <select id="level" aria-label="Stufe"></select>
    </div>
    <div id="tally"></div>
    <div id="results"></div>
  </div>
  <div id="detail"></div>
</main>

<footer>
  <p id="provenance"></p>
  <p>Die Daten enthalten Namen überwiegend minderjähriger Personen.
     Nicht öffentlich weitergeben.</p>
</footer>

const {entities: PEOPLE, courses: COURSES, teachers: STAFF, times: TIMES} = DATA;
const DAYS = ["Mo", "Di", "Mi", "Do", "Fr"];
const DAYS_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];
const LESSON_MINUTES = 45;
const de = new Intl.Collator("de", {numeric: true});

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const url = encodeURIComponent;
const link = (kind, id, text) => `<a href="#${kind}/${url(id)}">${esc(text)}</a>`;

const teacherName = ab => (STAFF[ab] && STAFF[ab].name) || ab + " (nicht im Kollegium)";

const courseName = c => c.scope ? `${c.subject} ${c.scope}` : c.subject;
const span = (a, b) => a === b ? `${a}. Std.` : `${a}.–${b}. Std.`;
const meetings = c => c.slots.map(s => `${DAYS[s[0]]} ${span(s[1], s[2])}`).join(", ");
const roomsOf = c => [...new Set(c.slots.map(s => s[3]).filter(Boolean))].join(", ");
const median = xs => {
  const s = [...xs].sort((a, b) => a - b);
  return s.length ? s[s.length >> 1] : 0;
};

/* Aktuelle Stunde, falls gerade Schulzeit ist. */
function rightNow() {
  const now = new Date();
  const day = now.getDay() - 1;
  if (day < 0 || day > 4) return null;
  const minutes = now.getHours() * 60 + now.getMinutes();
  for (let p = 10; p >= 1; p--) {
    const [h, m] = (TIMES[p] || "0:00").split(":").map(Number);
    if (minutes >= h * 60 + m && minutes < h * 60 + m + LESSON_MINUTES) {
      return {day, period: p};
    }
  }
  return {day, period: null};
}
const NOW = rightNow();

/* ===== Sortierbare Tabellen ===========================================
   table() liefert HTML und legt die Rohdaten ab. Jede Zelle hat einen
   Sortierwert und getrennt davon ihre Darstellung, damit auch Spalten mit
   Links richtig sortieren.                                              */

const tables = new Map();
let tableCount = 0;

function table(columns, rows, sort) {
  const id = "tbl" + (++tableCount);
  tables.set(id, {columns, rows,
    key: (sort && sort.key) || columns[0].key,
    dir: sort && sort.dir === -1 ? -1 : 1});
  return `<div class="scroll" data-table="${id}">${tableMarkup(id)}</div>`;
}

function tableMarkup(id) {
  const t = tables.get(id);
  const rows = [...t.rows].sort((a, b) => {
    const x = (a[t.key] || {}).sort ?? "";
    const y = (b[t.key] || {}).sort ?? "";
    const cmp = typeof x === "number" && typeof y === "number"
      ? x - y : de.compare(String(x), String(y));
    return cmp * t.dir;
  });
  const head = t.columns.map(c => {
    const state = c.key === t.key ? (t.dir === 1 ? "ascending" : "descending") : "none";
    return `<th data-col="${c.key}" aria-sort="${state}"` +
           `${c.right ? ' class="right"' : ""}>${esc(c.label)}</th>`;
  }).join("");
  const body = rows.map(r => "<tr>" + t.columns.map(c => {
    const cell = r[c.key] || {};
    return `<td${c.right ? ' class="right"' : ""}>` +
           `${cell.html !== undefined ? cell.html : esc(cell.sort ?? "")}</td>`;
  }).join("") + "</tr>").join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

const cell = (sort, html) => ({sort, html});
const plain = rows => '<table class="plain"><tbody>' +
  rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("") + "</tbody></table>";

/* ===== Wochenraster ==================================================== */

function occupancy(ids, onlyRoom) {
  const grid = {};
  for (const id of ids) {
    for (const [day, first, last, room] of COURSES[id].slots) {
      if (onlyRoom && room !== onlyRoom) continue;
      for (let p = first; p <= last; p++) {
        grid[day + "|" + p] = {id, room, top: p === first, span: last - first + 1};
      }
    }
  }
  return grid;
}

/* opts: {stufe, teacher, room} steuert, was in der zweiten Zeile einer Zelle
   steht. Doppel-/Dreifachstunden werden per rowspan zu einem Block
   zusammengefasst statt eine zweite, scheinbar freie Zelle zu zeigen. */
function week(ids, opts, onlyRoom) {
  const show = Object.assign({stufe: true, teacher: true, room: true}, opts);
  const grid = occupancy(ids, onlyRoom);
  return weekGrid((day, period) => {
    const slot = grid[day + "|" + period];
    if (!slot || !slot.top) return null;
    const c = COURSES[slot.id];
    const bits = [];
    if (show.stufe) bits.push(c.levels.join("/"));
    if (show.teacher) bits.push(teacherShort(c.teacher));
    if (show.room) bits.push(slot.room || "");
    return {
      rowspan: slot.span,
      html: `<div class="lesson${slot.span > 1 ? " multi" : ""}">` +
            `${link("kurs", slot.id, courseName(c))}` +
            `<span>${esc(bits.filter(Boolean).join(" · "))}</span></div>`
    };
  }, Math.max(6, ...Object.keys(grid).map(k => +k.split("|")[1]), 0));
}

/* cellData(day, period) liefert null (leere Zelle) oder {html, rowspan}.
   Zellen, die von einem rowspan der Zeile darüber abgedeckt sind, werden
   ausgelassen statt doppelt gezeichnet zu werden. */
function weekGrid(cellData, lastPeriod) {
  const only = NOW ? NOW.day : 0;
  let out = '<div class="daytabs">' + DAYS.map((d, i) =>
      `<button data-day="${i}"${i === only ? ' aria-current="true"' : ""}>${d}</button>`
    ).join("") + "</div>";
  out += `<div class="scroll"><table class="week" data-only="${only}"><thead><tr><th></th>` +
    DAYS.map((d, i) => `<th data-d="${i}">${d}</th>`).join("") + "</tr></thead><tbody>";
  const skipUntil = Array(DAYS.length).fill(0);
  for (let p = 1; p <= lastPeriod; p++) {
    const nowRow = NOW && NOW.period === p ? " class=\"now\"" : "";
    out += `<tr${nowRow}><td class="hour">${p}<small>${TIMES[p] || ""}</small></td>`;
    for (let d = 0; d < DAYS.length; d++) {
      if (skipUntil[d] >= p) continue;
      const info = cellData(d, p) || {};
      const rowspan = info.rowspan > 1 ? info.rowspan : 1;
      if (rowspan > 1) skipUntil[d] = p + rowspan - 1;
      const isNow = NOW && NOW.day === d && NOW.period >= p && NOW.period <= p + rowspan - 1;
      out += `<td data-d="${d}"${isNow ? ' class="now"' : ""}` +
             `${rowspan > 1 ? ` rowspan="${rowspan}"` : ""}>${info.html || ""}</td>`;
    }
    out += "</tr>";
  }
  return out + "</tbody></table></div>";
}

document.addEventListener("click", event => {
  const tab = event.target.closest(".daytabs button");
  if (!tab) return;
  const box = tab.parentElement;
  box.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-current", String(b === tab)));
  box.nextElementSibling.querySelector(".week").dataset.only = tab.dataset.day;
});

function attendance(ids) {
  const grid = occupancy(ids);
  return DAYS_LONG.map((name, d) => {
    const used = [];
    for (let p = 1; p <= 10; p++) if (grid[d + "|" + p]) used.push(p);
    if (!used.length) return [name, "frei"];
    const first = used[0], last = used[used.length - 1], gaps = [];
    for (let p = first; p <= last; p++) if (!grid[d + "|" + p]) gaps.push(p);
    return [name, `${first}.–${last}. Stunde, ab ${TIMES[first]}` +
      (gaps.length ? ` · ${gaps.length > 1 ? "Freistunden" : "Freistunde"} ${gaps.join(", ")}` : "")];
  });
}

/* ===== Kennzahlen eines Plans =========================================
   Bewusst einzelne Zahlen neben dem Median der Stufe statt einer
   Gesamtnote: was ein guter Plan ist, entscheidet die Person selbst.   */

const METRICS = [
  ["hours", "Wochenstunden"],
  ["days", "Unterrichtstage"],
  ["gaps", "Freistunden"],
  ["early", "Tage mit 1. Stunde"],
  ["late", "Stunden ab der 8."],
  ["longest", "längster Tag (Stunden)"]
];

function metrics(ids) {
  const grid = occupancy(ids);
  const out = {hours: 0, days: 0, gaps: 0, early: 0, late: 0, longest: 0};
  for (let d = 0; d < DAYS.length; d++) {
    const used = [];
    for (let p = 1; p <= 10; p++) if (grid[d + "|" + p]) used.push(p);
    if (!used.length) continue;
    const first = used[0], last = used[used.length - 1];
    out.days++;
    out.hours += used.length;
    out.gaps += (last - first + 1) - used.length;
    out.longest = Math.max(out.longest, last - first + 1);
    if (first === 1) out.early++;
    out.late += used.filter(p => p >= 8).length;
  }
  return out;
}

const levelStats = new Map();
function levelMedian(level) {
  if (levelStats.has(level)) return levelStats.get(level);
  const all = Object.values(PEOPLE).filter(e => e.level === level && e.courses.length)
    .map(e => metrics(e.courses));
  const out = {};
  for (const [key] of METRICS) out[key] = median(all.map(m => m[key]));
  levelStats.set(level, out);
  return out;
}

/* ===== Raumbelegung ==================================================== */

let roomIndex = null;
function rooms() {
  if (roomIndex) return roomIndex;
  const busy = new Map(), names = new Set();
  for (const c of Object.values(COURSES)) {
    for (const [day, first, last, room] of c.slots) {
      if (!room) continue;
      names.add(room);
      for (let p = first; p <= last; p++) busy.set(room + "|" + day + "|" + p, c.id);
    }
  }
  return roomIndex = {names: [...names].sort(de.compare), busy};
}

const freeRooms = (day, periods) => rooms().names.filter(r =>
  periods.every(p => !rooms().busy.has(r + "|" + day + "|" + p)));

function personView(name) {
  const person = PEOPLE[name];
  const ids = person.courses;

  const courseRows = ids.map(id => {
    const c = COURSES[id];
    return {
      fach: cell(courseName(c), link("kurs", id, courseName(c))),
      lehrkraft: cell(teacherName(c.teacher),
        link("lehrkraft", c.teacher, teacherName(c.teacher))),
      raum: cell(roomsOf(c), esc(roomsOf(c))),
      termine: cell(meetings(c), esc(meetings(c))),
      stunden: cell(c.hours, c.hours)
    };
  });

  const shared = new Map();
  for (const id of ids) {
    for (const other of COURSES[id].members) {
      if (other === name) continue;
      if (!shared.has(other)) shared.set(other, []);
      shared.get(other).push(id);
    }
  }
  const peers = [...shared].map(([other, list]) => {
    list.sort((a, b) => COURSES[b].hours - COURSES[a].hours);
    const hours = list.reduce((sum, id) => sum + COURSES[id].hours, 0);
    return {
      name: cell(other, link("person", other, other)),
      stunden: cell(hours, hours),
      kurse: cell(list.length, list.length),
      gemeinsam: cell(list.map(id => courseName(COURSES[id])).join(", "),
        list.map(id => link("kurs", id, courseName(COURSES[id]))).join(", "))
    };
  });

  const mine = metrics(ids), typical = levelMedian(person.level);
  const numbers = METRICS.map(([key, label]) => [
    label, `${mine[key]} <span style="color:var(--ink-3)">
      (Stufe ${person.level}: ${typical[key]})</span>`
  ]);

  return `<h2>${esc(name)}</h2>
    <div class="summary">${person.kind} · Stufe ${esc(person.level)} ·
      ${ids.length} Kurse · ${person.hours} Wochenstunden</div>
    <h3>Woche</h3>${week(ids)}
    <h3>Anwesenheit</h3>${plain(attendance(ids))}
    <h3>Kennzahlen</h3>
    <p class="note">In Klammern der Mittelwert (Median) der Stufe.</p>
    ${plain(numbers)}
    <h3>Kurse</h3>${table([
      {key: "fach", label: "Fach"},
      {key: "lehrkraft", label: "Lehrkraft"},
      {key: "raum", label: "Raum"},
      {key: "termine", label: "Termine"},
      {key: "stunden", label: "Std.", right: true}
    ], courseRows)}
    <h3>${person.kind === "Klasse" ? "Klassen mit gemeinsamem Unterricht"
                                   : "Sieht diese Mitschüler:innen"}</h3>
    <p class="note">${peers.length} Treffer, nach gemeinsamen Wochenstunden.
      Jede Spaltenüberschrift sortiert neu.</p>
    ${table([
      {key: "name", label: "Name"},
      {key: "stunden", label: "Std.", right: true},
      {key: "kurse", label: "Kurse", right: true},
      {key: "gemeinsam", label: "gemeinsam"}
    ], peers, {key: "stunden", dir: -1})}`;
}

/* Kurse, die zeitlich kollidieren: eine Kombination beider ist unmoeglich. */
function parallelTo(id) {
  const course = COURSES[id];
  const mine = new Set();
  for (const [day, first, last] of course.slots) {
    for (let p = first; p <= last; p++) mine.add(day + "|" + p);
  }
  const members = new Set(course.members);
  const out = [];
  for (const [other, c] of Object.entries(COURSES)) {
    if (other === id) continue;
    const related = course.scope
      ? c.members.some(m => members.has(m))
      : c.levels.some(l => course.levels.includes(l));
    if (!related) continue;
    let overlap = 0;
    for (const [day, first, last] of c.slots) {
      for (let p = first; p <= last; p++) if (mine.has(day + "|" + p)) overlap++;
    }
    if (overlap) out.push({id: other, overlap});
  }
  return out;
}

function courseView(id) {
  const c = COURSES[id];
  const dates = c.slots.map(([day, first, last, room]) => ({
    tag: cell(day, DAYS_LONG[day]),
    stunden: cell(first, span(first, last)),
    beginn: cell(first, TIMES[first] || ""),
    raum: cell(room || "", esc(room || ""))
  }));
  const clash = (c.scope ? [] : parallelTo(id)).map(({id: other, overlap}) => ({
    fach: cell(courseName(COURSES[other]), link("kurs", other, courseName(COURSES[other]))),
    lehrkraft: cell(teacherName(COURSES[other].teacher),
      link("lehrkraft", COURSES[other].teacher, teacherName(COURSES[other].teacher))),
    ueberschneidung: cell(overlap, overlap)
  }));

  return `<h2>${esc(courseName(c))}</h2>
    <div class="summary">${esc(c.code)} · Stufe ${esc(c.levels.join(", "))} ·
      ${link("lehrkraft", c.teacher, teacherName(c.teacher))} ·
      ${c.hours} Wochenstunden · ${c.members.length}
      ${c.members.length === 1 ? "Teilnehmer" : "Teilnehmer:innen"}</div>
    <h3>Termine</h3>${table([
      {key: "tag", label: "Tag"},
      {key: "stunden", label: "Stunden"},
      {key: "beginn", label: "Beginn"},
      {key: "raum", label: "Raum"}
    ], dates)}
    ${c.scope ? "" : `<h3>Liegt zeitgleich mit</h3>
    <p class="note">${clash.length} Kurse derselben Stufe. Wer diesen Kurs belegt,
      kann keinen davon zusätzlich belegen.</p>
    ${clash.length ? table([
      {key: "fach", label: "Fach"},
      {key: "lehrkraft", label: "Lehrkraft"},
      {key: "ueberschneidung", label: "Stunden", right: true}
    ], clash, {key: "ueberschneidung", dir: -1}) : ""}`}
    <h3>Teilnehmerliste</h3>
    <div class="roster">${c.members.map((m, i) =>
      `<div><i>${i + 1}</i>${link("person", m, m)}</div>`).join("")}</div>`;
}

function teacherView(ab) {
  const ids = STAFF[ab].courses;
  const learners = new Set();
  ids.forEach(id => COURSES[id].members.forEach(m => learners.add(m)));
  const hours = ids.reduce((sum, id) => sum + COURSES[id].hours, 0);
  const rows = ids.map(id => {
    const c = COURSES[id];
    return {
      fach: cell(courseName(c), link("kurs", id, courseName(c))),
      stufe: cell(c.levels.join(", "), esc(c.levels.join(", "))),
      termine: cell(meetings(c), esc(meetings(c))),
      raum: cell(roomsOf(c), esc(roomsOf(c))),
      groesse: cell(c.members.length, c.members.length)
    };
  });
  return `<h2>${esc(teacherName(ab))}</h2>
    <div class="summary">Kürzel ${esc(ab)}${STAFF[ab].subjects
      ? " · " + esc(STAFF[ab].subjects) : ""} ·
      ${ids.length} ${ids.length === 1 ? "Kurs" : "Kurse"} ·
      ${hours} Wochenstunden · ${learners.size} Lerngruppen-Mitglieder</div>
    <h3>Woche</h3>${week(ids, {teacher: false})}
    <h3>Freie Stunden</h3>${plain(attendance(ids))}
    <h3>Kurse</h3>${table([
      {key: "fach", label: "Fach"},
      {key: "stufe", label: "Stufe"},
      {key: "termine", label: "Termine"},
      {key: "raum", label: "Raum"},
      {key: "groesse", label: "Größe", right: true}

}

function roomView(room) {
  const ids = Object.keys(COURSES).filter(id => COURSES[id].slots.some(s => s[3] === room));
  const hours = ids.reduce((sum, id) => sum + COURSES[id].slots
    .filter(s => s[3] === room).reduce((h, s) => h + s[2] - s[1] + 1, 0), 0);
  const rows = ids.map(id => {
    const c = COURSES[id];
    const here = c.slots.filter(s => s[3] === room)
      .map(s => `${DAYS[s[0]]} ${span(s[1], s[2])}`).join(", ");
    return {
      fach: cell(courseName(c), link("kurs", id, courseName(c))),
      stufe: cell(c.levels.join(", "), esc(c.levels.join(", "))),
      lehrkraft: cell(teacherName(c.teacher),
        link("lehrkraft", c.teacher, teacherName(c.teacher))),
      termine: cell(here, esc(here))
    };
  });
  return `<h2>Raum ${esc(room)}</h2>
    <div class="summary">${ids.length} Kurse · ${hours} von 50 möglichen
      Wochenstunden belegt</div>
    <h3>Belegung</h3>${week(ids, {room: false}, room)}
    <h3>Kurse</h3>${table([
      {key: "fach", label: "Fach"},
      {key: "stufe", label: "Stufe"},
      {key: "lehrkraft", label: "Lehrkraft"},
      {key: "termine", label: "Termine"}
    ], rows)}`;
}

/* --- Terminsuche ------------------------------------------------------- */

/* group: Array aus {kind: "person"|"teacher", id}. */
let group = [];

const coursesOf = g => g.kind === "teacher" ? STAFF[g.id].courses : PEOPLE[g.id].courses;
const groupLabel = g => g.kind === "teacher" ? teacherName(g.id) + " (Lehrkraft)" : g.id;

function finderView() {
  if (!group.length) {
    return `<h2>Termin finden</h2>
      <div class="summary">Wann haben mehrere Personen, Klassen oder Lehrkräfte
        gleichzeitig frei, und wo sehen sie sich bereits im Unterricht?</div>
      <p class="note">Links jemanden anklicken, um ihn hinzuzufügen.
        Klassen, Schüler:innen und Lehrkräfte lassen sich mischen.</p>`;
  }

  const busy = new Set();
  for (const g of group) {
    for (const id of coursesOf(g)) {
      for (const [day, first, last] of COURSES[id].slots) {
        for (let p = first; p <= last; p++) busy.add(day + "|" + p);
      }
    }
  }
  const isFree = (day, period) => !busy.has(day + "|" + period);

  const shared = new Map();
  for (const g of group) {
    for (const id of coursesOf(g)) {
      if (!shared.has(id)) shared.set(id, []);
      shared.get(id).push(g);
    }
  }
  const sharedRows = [...shared].filter(([, list]) => list.length > 1).map(([id, list]) => {
    const c = COURSES[id];
    const names = list.map(groupLabel).join(", ");
    return {
      fach: cell(courseName(c), link("kurs", id, courseName(c))),
      lehrkraft: cell(teacherName(c.teacher),
        link("lehrkraft", c.teacher, teacherName(c.teacher))),
      termine: cell(meetings(c), esc(meetings(c))),
      raum: cell(roomsOf(c), esc(roomsOf(c))),
      beteiligte: cell(list.length,
        `${list.length}<span style="color:var(--ink-3)"> · ${esc(names)}</span>`)
    };
  });

  const blocks = [];
  for (let d = 0; d < DAYS.length; d++) {
    let run = [];
    for (let p = 1; p <= 10; p++) {
      if (isFree(d, p)) run.push(p);
      else if (run.length) { blocks.push([d, run]); run = []; }
    }
    if (run.length) blocks.push([d, run]);
  }

  const rows = blocks.map(([day, periods]) => {
    const free = freeRooms(day, periods);
    return {
      tag: cell(day, DAYS_LONG[day]),
      stunden: cell(periods[0], span(periods[0], periods[periods.length - 1])),
      laenge: cell(periods.length, periods.length),
      beginn: cell(periods[0], TIMES[periods[0]] || ""),
      raeume: cell(free.length,
        `${free.length}<span style="color:var(--ink-3)"> · ` +
        `${esc(free.slice(0, 8).join(", "))}${free.length > 8 ? " …" : ""}</span>`)
    };
  });

  const chips = group.map((g, i) =>
    `<button data-drop="${i}">${esc(groupLabel(g))}</button>`).join("") +
    '<button class="clear" data-drop="*">alle entfernen</button>';

  const persons = group.filter(g => g.kind === "person").length;
  const staff = group.filter(g => g.kind === "teacher").length;
  const summary = [
    persons ? `${persons} ${persons === 1 ? "Person/Klasse" : "Personen/Klassen"}` : "",
    staff ? `${staff} ${staff === 1 ? "Lehrkraft" : "Lehrkräfte"}` : ""
  ].filter(Boolean).join(", ");

  return `<h2>Termin finden</h2>
    <div class="summary">${summary} ·
      ${blocks.reduce((n, b) => n + b[1].length, 0)} gemeinsam freie Stunden ·
      ${sharedRows.length} gemeinsame Kurse</div>
    <div class="chips">${chips}</div>
    ${group.length > 1 ? `<h3>Gemeinsame Kurse</h3>
    <p class="note">Kurse, in denen sich mindestens zwei der Ausgewählten bereits sehen.</p>
    ${sharedRows.length ? table([
      {key: "fach", label: "Fach"},
      {key: "lehrkraft", label: "Lehrkraft"},
      {key: "termine", label: "Termine"},
      {key: "raum", label: "Raum"},
      {key: "beteiligte", label: "Beteiligte", right: true}
    ], sharedRows, {key: "beteiligte", dir: -1})
      : '<p class="note">Kein gemeinsamer Kurs.</p>'}` : ""}
    <h3>Gemeinsam frei</h3>
    ${weekGrid((d, p) => isFree(d, p) ? {html: '<div class="free">frei</div>'} : null, 10)}
    <h3>Freie Blöcke</h3>
    <p class="note">„Frei“ heißt: kommt in diesen Plänen nicht vor.
      AGs, Konferenzen, Vertretung und Fremdnutzung stehen nicht in den PDFs.</p>
    ${rows.length ? table([
      {key: "tag", label: "Tag"},
      {key: "stunden", label: "Stunden"},
      {key: "laenge", label: "Länge", right: true},
      {key: "beginn", label: "Beginn"},
      {key: "raeume", label: "Freie Räume"}
    ], rows, {key: "laenge", dir: -1})
      : '<p class="note">Kein einziger gemeinsamer freier Slot.</p>'}`;
}

      ["Doppelstunden", "zählen als zwei Wochenstunden"],
      ["Klassenpläne", "zeigen die Klasse als Ganzes, keine einzelnen Schüler:innen"],

/* ===== Liste und Navigation ============================================ */

let view = "people", selected = null, level = "";

const $search = document.getElementById("search");
const $level = document.getElementById("level");
const $results = document.getElementById("results");
const $tally = document.getElementById("tally");
const $detail = document.getElementById("detail");

function entries() {
  if (view === "people") {
    return Object.keys(PEOPLE).sort(de.compare)
      .filter(n => !level || PEOPLE[n].level === level)
      .map(n => ({
        id: n, kind: "person", route: "person/" + url(n), title: n,
        note: `${PEOPLE[n].level} · ${PEOPLE[n].courses.length} Kurse, ${PEOPLE[n].hours} Std.`,
        haystack: (n + " " + PEOPLE[n].level + " " +
          PEOPLE[n].courses.map(id => courseName(COURSES[id])).join(" ")).toLowerCase()
      }));
  }
  if (view === "finder") {
    const people = Object.keys(PEOPLE).sort(de.compare)
      .filter(n => !level || PEOPLE[n].level === level)
      .map(n => ({
        id: n, kind: "person", route: "", title: n,
        note: `${PEOPLE[n].level} · ${PEOPLE[n].courses.length} Kurse, ${PEOPLE[n].hours} Std.`,
        haystack: (n + " " + PEOPLE[n].level + " " +
          PEOPLE[n].courses.map(id => courseName(COURSES[id])).join(" ")).toLowerCase()
      }));
    const staff = Object.keys(STAFF)
      .filter(ab => !level || STAFF[ab].courses.some(id => COURSES[id].levels.includes(level)))
      .sort((a, b) => de.compare(teacherName(a), teacherName(b)))
      .map(ab => ({
        id: ab, kind: "teacher", route: "", title: teacherName(ab) + " · Lehrkraft",
        note: `${STAFF[ab].courses.length} Kurse` +
              `${STAFF[ab].subjects ? " · " + STAFF[ab].subjects : ""}`,
        haystack: (ab + " " + teacherName(ab) + " " + STAFF[ab].subjects + " " +
          STAFF[ab].courses.map(id => courseName(COURSES[id])).join(" ")).toLowerCase()
      }));
    return [...people, ...staff];
  }
  if (view === "courses") {
    return Object.keys(COURSES)
      .filter(id => !level || COURSES[id].levels.includes(level))
      .sort((a, b) => de.compare(courseName(COURSES[a]), courseName(COURSES[b])))
      .map(id => ({
        id, route: "kurs/" + url(id), title: courseName(COURSES[id]),
        note: `${COURSES[id].levels.join(", ")} · ${teacherName(COURSES[id].teacher)} · ` +
              `${COURSES[id].members.length}`,
        haystack: (COURSES[id].code + " " + courseName(COURSES[id]) + " " +
          COURSES[id].levels.join(" ") + " " + teacherName(COURSES[id].teacher) + " " +
          roomsOf(COURSES[id])).toLowerCase()
      }));
  }
  if (view === "teachers") {
    return Object.keys(STAFF)
      .filter(ab => !level || STAFF[ab].courses.some(id => COURSES[id].levels.includes(level)))
      .sort((a, b) => de.compare(teacherName(a), teacherName(b)))
      .map(ab => ({
        id: ab, route: "lehrkraft/" + url(ab), title: teacherName(ab),
        note: `${STAFF[ab].courses.length} Kurse` +
              `${STAFF[ab].subjects ? " · " + STAFF[ab].subjects : ""}`,
        haystack: (ab + " " + teacherName(ab) + " " + STAFF[ab].subjects + " " +
          STAFF[ab].courses.map(id => courseName(COURSES[id])).join(" ")).toLowerCase()
      }));
  }
  return rooms().names
    .filter(r => !level || Object.values(COURSES)
      .some(c => c.levels.includes(level) && c.slots.some(s => s[3] === r)))
    .map(r => ({
      id: r, route: "raum/" + url(r), title: r,
      note: Object.values(COURSES).filter(c => c.slots.some(s => s[3] === r)).length + " Kurse",
      haystack: r.toLowerCase()
    }));
}

function renderList() {
  const terms = $search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const all = entries();
  const hits = terms.length
    ? all.filter(e => terms.every(t => e.haystack.includes(t))) : all;
  $tally.textContent = terms.length
    ? `${hits.length} von ${all.length}` : `${all.length} Einträge`;
  const isCurrent = e => view === "finder"
    ? group.some(g => g.kind === e.kind && g.id === e.id)
    : e.id === selected;
  $results.innerHTML = hits.length
    ? hits.map(e => `<button data-id="${esc(e.id)}" data-kind="${esc(e.kind || "")}"` +
        ` data-route="${e.route}"${isCurrent(e) ? ' aria-current="true"' : ""}>` +
        `<b>${esc(e.title)}</b><small>${esc(e.note)}</small></button>`).join("")
    : '<div class="blank">Kein Treffer</div>';
}

function show(html) {
  tables.clear();
  $detail.innerHTML = html;
}

function route() {
  const [kind, ...rest] = decodeURIComponent(location.hash.slice(1)).split("/");
  const id = rest.join("/");

  if (kind === "kurs" && COURSES[id]) { view = "courses"; selected = id; show(courseView(id)); }
  else if (kind === "lehrkraft" && STAFF[id]) { view = "teachers"; selected = id; show(teacherView(id)); }
  else if (kind === "person" && PEOPLE[id]) { view = "people"; selected = id; show(personView(id)); }
  else if (kind === "raum" && rooms().names.includes(id)) { view = "rooms"; selected = id; show(roomView(id)); }
  else if (kind === "termin") { view = "finder"; selected = null; show(finderView()); }
  else { selected = null; show(overview()); }

  document.querySelectorAll("nav button[data-view]").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.view === view)));
  renderList();
  if (selected && window.innerWidth <= 860) $detail.scrollIntoView({block: "start"});
}

document.querySelectorAll("nav button[data-view]").forEach(button =>
  button.addEventListener("click", () => {
    view = button.dataset.view;
    selected = null;
    $search.value = "";
    const target = view === "finder" ? "#termin" : "";
    if (location.hash !== target) location.hash = target; else route();
  }));

$results.addEventListener("click", event => {
  const button = event.target.closest("button[data-route]");
  if (!button) return;
  if (view === "finder") {
    const entry = {kind: button.dataset.kind, id: button.dataset.id};
    const idx = group.findIndex(g => g.kind === entry.kind && g.id === entry.id);
    if (idx === -1) group.push(entry); else group.splice(idx, 1);
    show(finderView());
    renderList();
  } else {
    location.hash = button.dataset.route;
  }
});

$detail.addEventListener("click", event => {
  const chip = event.target.closest("[data-drop]");
  if (!chip) return;
  if (chip.dataset.drop === "*") group = [];
  else group.splice(Number(chip.dataset.drop), 1);
  show(finderView());
  renderList();
});

$search.addEventListener("input", renderList);
$level.addEventListener("change", () => { level = $level.value; renderList(); });
window.addEventListener("hashchange", route);

const THEMES = [["auto", "Auto"], ["light", "Hell"], ["dark", "Dunkel"]];
const $theme = document.getElementById("theme");

function setTheme(value) {
  document.documentElement.dataset.theme = value;
  $theme.textContent = (THEMES.find(t => t[0] === value) || THEMES[0])[1];
  try { localStorage.setItem("theme", value); } catch (e) { /* Datei ohne Speicher */ }
}
$theme.addEventListener("click", () => {
  const index = THEMES.findIndex(t => t[0] === document.documentElement.dataset.theme);
  setTheme(THEMES[(index + 1) % THEMES.length][0]);
