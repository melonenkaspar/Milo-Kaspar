    :root {
      --bg: #0f0f1a; --card: #1a1a2e; --card2: #16213e;

    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

    header {
      text-align: center; padding: 3rem 1rem 2rem;
      background: linear-gradient(135deg,#0f1a2e,#0a1628,#0f2040);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: clamp(1.8rem,4vw,3rem);
      background: linear-gradient(90deg,#67e8f9,#f59e0b,#34d399);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: .5rem;
    }
    header p { color: var(--muted); font-size: 1rem; }
    .badge { display:inline-block; background:var(--accent); color:#000; padding:.2rem .7rem; border-radius:9999px; font-size:.8rem; margin-top:.5rem; font-weight:600; }

    .filters {
      display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center;
      padding:1.2rem 1rem; background:var(--card); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:20;
    }
    .filter-btn {
      background:var(--border); border:1px solid #3d3d5e; color:var(--muted);
      padding:.4rem 1rem; border-radius:9999px; cursor:pointer; font-size:.85rem; transition:all .2s;
    }
    .filter-btn:hover,.filter-btn.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }

    .grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
      gap:1.5rem; padding:2rem; max-width:1500px; margin:0 auto;
    }

    .card {
      background:var(--card); border:1px solid var(--border);
      border-radius:1rem; overflow:hidden;
      display:flex; flex-direction:column;
      transition:transform .2s, box-shadow .2s;
    }
    .card:hover { transform:translateY(-3px); box-shadow:0 8px 30px rgba(6,182,212,.2); }

    .card-inner { padding:1.5rem; display:flex; flex-direction:column; align-items:center; flex:1; }
    .card h2 { font-size:.95rem; text-align:center; margin-bottom:1.2rem; line-height:1.4; min-height:2.8em; }
    .chart-wrap { width:100%; max-width:260px; }

    .legend { width:100%; margin-top:1rem; display:flex; flex-direction:column; gap:.3rem; }
    .legend-item { display:flex; align-items:center; gap:.5rem; font-size:.82rem; color:var(--muted); }
    .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .legend-label { flex:1; }
    .legend-count { font-weight:600; color:var(--text); }

    .raw-toggle {
      width:100%; background:var(--border); border:none; color:var(--muted);
      padding:.6rem 1rem; cursor:pointer; font-size:.82rem; text-align:left;
      display:flex; align-items:center; justify-content:space-between;
      transition:background .2s, color .2s;
    }
    .raw-toggle:hover { background:#3d3d5e; color:var(--text); }
    .raw-toggle .arrow { transition:transform .25s; font-size:.75rem; }
    .raw-toggle.open .arrow { transform:rotate(180deg); }

    .raw-panel {
      max-height:0; overflow:hidden;
      transition:max-height .35s ease;
      background:var(--card2); border-top:1px solid var(--border);
    }
    .raw-panel.open { max-height:600px; overflow-y:auto; }
    .raw-panel::-webkit-scrollbar { width:4px; }
    .raw-panel::-webkit-scrollbar-track { background:var(--border); }
    .raw-panel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }

    .raw-list { padding:.8rem 1rem; display:flex; flex-direction:column; gap:.4rem; }
    .raw-item {
      background:var(--border); border-radius:.5rem; padding:.5rem .75rem;
      font-size:.8rem; color:var(--muted); line-height:1.5;
      border-left:3px solid var(--accent);
      white-space:pre-wrap; word-break:break-word;
    }
    .raw-item:nth-child(even) { border-left-color: var(--accent2); }
    .raw-num { font-size:.7rem; color:#4a4a7a; margin-right:.3rem; }

    .card.freetext .card-inner { align-items:flex-start; }
    .card.freetext h2 { text-align:left; min-height:unset; }

    /* Trans/Cis person cards */
    .trans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      width: 100%;
      margin-top: .5rem;
    }
    .trans-person {
      display: flex; flex-direction: column; align-items: center; gap: .4rem;
    }
    .trans-photo {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--border); border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: var(--muted); overflow: hidden;
      flex-shrink: 0;
    }
    .trans-photo img { width:100%; height:100%; object-fit:cover; }
    .trans-label {
      font-size: .78rem; color: var(--text); text-align: center; font-weight: 600;
    }
    .trans-type {
      font-size: .68rem; color: var(--muted); text-align: center;
    }
    .trans-votes {
      font-size: .72rem; background: var(--accent); color: #000;
      padding: .1rem .4rem; border-radius: 9999px; font-weight: 700;
    }

    .yesno-bar {
      width: 100%; margin-top: .8rem; display: flex; flex-direction: column; gap: .5rem;
    }
    .yesno-row { display: flex; align-items: center; gap: .5rem; font-size: .82rem; }
    .yesno-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .yesno-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
    .yesno-label { width: 80px; color: var(--muted); text-align: right; }
    .yesno-count { width: 24px; text-align: right; font-weight: 600; color: var(--text); }

    footer { text-align:center; padding:2rem; color:var(--muted); font-size:.85rem; border-top:1px solid var(--border); margin-top:2rem; }
  </style>
</head>

function makeRawPanel(answers, showNames=false) {
  const id = 'raw_' + (cid++);
  const listHTML = answers.map((a, i) =>
    `<div class="raw-item"><span class="raw-num">#${i+1}</span>${escHtml(a)}</div>`
  ).join('');
  return `
    <button class="raw-toggle" onclick="toggleRaw(this)" aria-expanded="false">
      <span>📋 Alle ${answers.length} Rohantworten anzeigen</span>
      <span class="arrow">▼</span>
    </button>
    <div class="raw-panel" id="${id}">
      <div class="raw-list">${listHTML}</div>
    </div>`;
}

function toggleRaw(btn) {
  const panel = btn.nextElementSibling;
  const open = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
  btn.querySelector('span:first-child').textContent =
    open ? `📋 Rohantworten schließen` : `📋 Alle ${panel.querySelectorAll('.raw-item').length} Rohantworten anzeigen`;
}

function makeChart(canvasId, labels, values, type='pie') {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type,
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: type==='bar' ? PALETTE.slice(0,labels.length).map(c=>c+'cc') : PALETTE.slice(0,labels.length),
        borderColor: type==='bar' ? PALETTE.slice(0,labels.length) : '#0f0f1a',
        borderWidth: 2, borderRadius: type==='bar' ? 6 : 0
      }]
    },
    options: {
      responsive: true,
      indexAxis: type==='bar' ? 'y' : undefined,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.label}: ${c.parsed.x ?? c.parsed} Stimmen` } }
      },
      scales: type==='bar' ? {
        x: { ticks:{color:'#94a3b8'}, grid:{color:'#2d2d4a'} },
        y: { ticks:{color:'#94a3b8',font:{size:11}}, grid:{display:false} }
      } : {}
    }
  });
}

function makeLegend(labels, values) {
  return labels.map((l,j) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${PALETTE[j]}"></div>
      <span class="legend-label">${l}</span>
      <span class="legend-count">${values[j]}</span>
    </div>`).join('');
}

function addPieCard(cat, title, data, chartType='pie') {
  const labels = Object.keys(data), values = Object.values(data);
  const id = 'chart_' + (cid++);
  const isBar = chartType==='bar';
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.cat = cat;
  const rawKey = title.replace(/ [^\w\s].*$/,'').trim();
  const rawAnswers = RAW[Object.keys(RAW).find(k => title.includes(k.split('?')[0]) || k.includes(title.split('?')[0])) || title] || [];
  card.innerHTML = `
    <div class="card-inner">
      <h2>${title}</h2>
      <div class="chart-wrap" style="max-width:${isBar?'100%':'260px'}">
        <canvas id="${id}" ${isBar?'height="200"':''}></canvas>
      </div>
      <div class="legend">${makeLegend(labels,values)}</div>
    </div>
    ${makeRawPanel(rawAnswers)}`;
  document.getElementById('grid').appendChild(card);
  setTimeout(() => makeChart(id, labels, values, chartType), 50);
}

function addFreeCard(cat, title) {
  const answers = RAW[title] || [];
  const card = document.createElement('div');
  card.className = 'card freetext'; card.dataset.cat = cat;
  const listHTML = answers.map((a, i) =>
    `<div class="raw-item"><span class="raw-num">#${i+1}</span>${escHtml(a)}</div>`
  ).join('');
  card.innerHTML = `
    <div class="card-inner" style="align-items:flex-start">
      <h2 style="text-align:left;min-height:unset">${title}</h2>
      <p style="font-size:.78rem;color:var(--muted);margin-bottom:.5rem">${answers.length} Antworten – alle sichtbar</p>
      <div style="max-height:320px;overflow-y:auto;width:100%;display:flex;flex-direction:column;gap:.4rem;padding-right:4px">
        ${listHTML}
      </div>
    </div>`;
  document.getElementById('grid').appendChild(card);
}

function addYesNoCard(cat, title, rawKey, yesCount, noCount, total) {
  const answers = RAW[rawKey] || [];
  const id = 'chart_' + (cid++);
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.cat = cat;
  card.innerHTML = `
    <div class="card-inner">
      <h2>${title}</h2>
      <div class="chart-wrap"><canvas id="${id}"></canvas></div>
      <div class="legend">${makeLegend(['Ja','Nein','Keine Angabe'],[yesCount,noCount,total-yesCount-noCount])}</div>
    </div>
    ${makeRawPanel(answers)}`;
  document.getElementById('grid').appendChild(card);
  const other = total - yesCount - noCount;
  setTimeout(() => makeChart(id, ['Ja','Nein','Keine Angabe'], [yesCount, noCount, other]), 50);
}

function addTransCard() {
  // Each of the 7 people gets a photo slot + their smash/pass breakdown
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.cat = 'trans';
  
  const peopleHTML = TRANS_DATA.map((person, idx) => {
    const smash = person.votes.filter(v => v === 'Smash').length;
    const pass = person.votes.filter(v => v === 'Pass').length;
    const total = person.votes.length;
    const smashPct = Math.round(smash / total * 100);
    return `
      <div class="trans-person">
        <div class="trans-photo">👤</div>
        <div class="trans-label">Person ${idx + 1}</div>
        <div class="trans-type">${person.label}</div>
        <div style="width:100%;margin-top:.3rem">
          <div style="font-size:.68rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:2px">
            <span>Smash</span><span>${smash}</span>
          </div>
          <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${smashPct}%;background:#06b6d4;border-radius:3px"></div>
          </div>
          <div style="font-size:.68rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:2px">
            <span>Pass</span><span>${pass}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  // Raw answers with names for trans section
  const rawRows = TRANS_DATA.map((person, idx) => {
    const votes = person.votes.map((v, i) => `${RESPONDENTS[i]}: ${v}`).join(' · ');
    return `<div class="raw-item"><span class="raw-num">Person ${idx+1} (${person.label})</span> ${escHtml(votes)}</div>`;
  }).join('');

  const rawId = 'raw_' + (cid++);

  card.innerHTML = `
    <div class="card-inner">
      <h2>Smash or Pass – Trans/Cis Personen 🏳️‍⚧️</h2>
      <div class="trans-grid">${peopleHTML}</div>
    </div>
    <button class="raw-toggle" onclick="toggleRaw(this)" aria-expanded="false">
      <span>📋 Alle Rohantworten mit Namen anzeigen</span>
      <span class="arrow">▼</span>
    </button>
    <div class="raw-panel" id="${rawId}">
      <div class="raw-list">${rawRows}</div>
    </div>`;
  document.getElementById('grid').appendChild(card);
}
